[project]
name = "audiobook-studio"
version = "0.1.0"
description = "Local book-to-audiobook pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
    "ebooklib>=0.19",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "charset-normalizer>=3.4",
    "lingua-language-detector>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
